<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kernel Workbench</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="brand" href="/">◈ <span>KERNEL<span class="light"> / WORKBENCH</span></span></a></header>
<main><div class="title"><div><div class="eyebrow">INFERENCE PERFORMANCE LAB</div><h1>모델에서 커널까지.</h1><p>실행 구조와 하드웨어 한계를 하나의 화면에서 추적합니다.</p></div><div class="actions"><select id="experiment" aria-label="실험 선택"><option value="" disabled selected>실험 불러오는 중…</option></select></div></div>
<section class="panel experiment-history" aria-labelledby="experiment-heading"><div class="panel-head"><div><h2 id="experiment-heading">최적화 실험 이력</h2></div></div><div id="experiment-list"><div class="empty">실험 이력을 불러오는 중…</div></div><div id="experiment-detail" hidden></div></section><details id="execution-method" class="panel execution-card collapsible-card" aria-labelledby="execution-heading" open hidden><summary class="panel-head"><h2 id="execution-heading">실행 방식 및 조건</h2></summary><div id="execution-details"></div></details><details id="experiment-correctness" class="panel correctness-card collapsible-card" aria-labelledby="correctness-heading" open hidden><summary class="panel-head"><div><h2 id="correctness-heading">정확성 검증</h2><span id="correctness-status" class="badge" role="status"></span></div></summary><div id="correctness-details"></div></details><div id="status" role="status"></div><div id="notice"></div><div id="result-unavailable" class="panel empty" role="status" hidden></div><div id="analysis-body"><section class="panel speed-card" aria-labelledby="speed-heading"><div class="panel-head"><div><h2 id="speed-heading">속도 측정</h2></div></div><div class="metrics" id="metrics"></div></section>
<section class="panel roof"><div class="panel-head"><div><h2>추론 Roofline</h2></div></div><div id="roof-phases" class="tabs roof-tabs"><button data-roof-phase="all" class="active">전체 비교</button><button data-roof-phase="prefill">Prefill</button><button data-roof-phase="decode">Decode</button></div><div id="roofline"></div><div class="roof-foot"><span>● 전체 <span style="color:#88bceb">■ Prefill</span> <span style="color:#8dd5b2">◆ Decode</span></span><span id="gpu-name"></span></div><div id="point-scope" class="point-summary"></div><p id="phase-notice" class="fine" role="status"></p></section>
<section class="panel logical-bounds" aria-labelledby="logical-bounds-heading"><div class="panel-head"><div><h2 id="logical-bounds-heading">단계별 이론 병목 · 논리적 하한</h2></div></div><div id="logical-bounds-cards"></div></section>
</div><footer aria-hidden="true"></footer></main><script type="module" src="/app.js?v=history-2"></script></body></html>
